name: wx-ensemble

# Builds the model-agreement forecast (wx-ensemble.json.gz) for the
# /trailtether/ page: TrailTether's hazard-veto ladder run over ICON, GFS and
# ECMWF, reporting how many independent models condemn each day.
#
# ⚠️ DELIBERATELY A SEPARATE WORKFLOW FROM dwd-thunder.yml, NOT A STEP IN IT.
# Two reasons, and both were learned the hard way in that file:
#
#   1. The thunder feed is a LIVE SAFETY DEPENDENCY — metno.js reads
#      `dwd_thunder_code`, and it is the only thing that makes the storm veto
#      reachable in South Africa. This ensemble is a product feature on a
#      marketing page. A failure here must never delay or block that.
#   2. dwd-thunder.yml carries a long note ending "a red run here must mean the
#      FORECAST failed", written after that workflow showed red for eight days
#      while working perfectly, and a real billing outage was consequently read
#      as "the thunder job, still broken". Adding a second product to that job
#      would break the signal in both directions: continue-on-error would hide
#      genuine ensemble failures, and letting it fail the job would put a
#      marketing feature's outage on a safety feed's status light.
#
# Separate workflows, separate signals. Red here means the ensemble failed.
#
# 🛑 RETIRED 2026-10-19 (owner's word: "retire it"). Nothing reads the output:
# the /trailtether/ page's ensemble panel was deleted in the 2026-09-17 audit
# (S-1; hilltrek-site/test/berg-live.js guards that it stays deleted), and
# neither the app nor any Supabase function ever fetched wx-ensemble.json.gz.
# It was still pulling ~530 MB of ICON from DWD per run, twice a day, for a
# file nobody opened. The workflow is disabled on GitHub and the schedule is
# removed here, so re-enabling it does not quietly bring the cron back. The
# last file published (18 Oct) stays on R2; nothing reads it.
# The scripts stay: `runs.py` (pick_run, day_complete) and the model adapters
# are reused by the mountain-weather job planned in trailtether's
# SCOPE-3d-weather.md. Manual runs still work (workflow_dispatch) once enabled.

on:
  # schedule removed 2026-10-19 (retired, see above). It was
  # `45 5,17 * * *`: twice a day, after the 00Z and 12Z ICON runs.
  workflow_dispatch:
    inputs:
      hours:
        description: 'Forecast horizon in hours (default 120)'
        required: false
      models:
        description: 'Comma-separated: icon,gfs,ecmwf'
        required: false

concurrency:
  # A slow run must not overlap the next schedule and publish out of order.
  group: wx-ensemble
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build & publish the model-agreement forecast
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # Same install as dwd-thunder.yml: the PyPI wheel does not reliably carry
      # the ecCodes C library.
      - name: Install ecCodes
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libeccodes0 libeccodes-dev
          python -m pip install --upgrade pip
          pip install numpy eccodes

      # Shared with dwd-thunder.yml by cache key: clat/clon are time-invariant
      # and identical for both, so whichever job runs first warms it.
      - name: Cache ICON cell index
        uses: actions/cache@v6
        with:
          path: .dwd-cache
          key: dwd-icon-cells-v1

      # Cheap, offline, and they pin the two things most able to be silently
      # wrong: the ported veto ladder and the GFS accumulation arithmetic.
      #
      # ⚠️ test_veto_parity.py SKIPS here and exits 0 — it needs metno.js from
      # the PRIVATE trailtether repo, which cannot be checked out here without
      # storing a private-repo read token in a public repo's secrets.
      #
      # It is NOT unpinned: as of 2026-08-31 it runs in trailtether's own CI
      # (.github/workflows/veto-parity.yml), which has metno.js locally and can
      # check THIS repo out with no credentials because it is public. That
      # workflow also runs nightly, which is what catches a change to veto.py
      # made here — a commit in this repo cannot trigger a workflow in that one.
      #
      # So the line below is a no-op in CI by design. Leave it: it still runs on
      # a developer machine, where it is the fastest way to catch drift before
      # pushing.
      - name: Tests
        run: |
          python scripts/test_gfs_accumulation.py
          python scripts/test_runs.py
          python scripts/test_gust_abstention.py
          python scripts/test_veto_parity.py

      - name: Build ensemble
        run: |
          python scripts/build_ensemble.py \
            --out out/wx-ensemble.json.gz \
            ${{ github.event.inputs.hours && format('--hours {0}', github.event.inputs.hours) || '' }} \
            ${{ github.event.inputs.models && format('--models {0}', github.event.inputs.models) || '' }}

      # build_ensemble.py exits non-zero and writes nothing when fewer than
      # --min-models models survive, so reaching this step means the artifact
      # counts a real majority. Publishing is separate for the same reason it
      # is in dwd-thunder.yml: a partial build must never overwrite a good file
      # with one that UNDER-COUNTS the models condemning a day.
      - name: Publish to R2
        env:
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          RCLONE_CONFIG_R2_ACL: private
        run: |
          curl -fsSL https://rclone.org/install.sh | sudo bash
          # --s3-no-check-bucket is REQUIRED: without it rclone attempts
          # CreateBucket and R2 answers 403 AccessDenied.
          rclone copyto out/wx-ensemble.json.gz r2:tt-tiles/weather/wx-ensemble.json.gz \
            --s3-no-check-bucket --header-upload "Cache-Control: public, max-age=3600"

      # Diagnostic only, and it runs AFTER publishing — see the long note on the
      # matching step in dwd-thunder.yml about why this must never fail the job.
      - name: Upload artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: wx-ensemble
          path: out/
          retention-days: 7
          if-no-files-found: warn
