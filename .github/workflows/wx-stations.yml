name: Weather Station Feed

# Publishes wx-stations.json.gz — one met.no forecast per Drakensberg station —
# so the HillTrek Weather Station widget never calls a weather provider itself.
#
# WHY THIS JOB LIVES IN THIS REPO. It is a sibling of the thunder forecast, not
# a different kind of thing: same shape (fetch open data on a schedule, publish
# one small static artifact to R2), same failure philosophy, and — the practical
# reason — the R2 secrets are already configured here. A new repo would need
# them re-added by hand, which is a place to fail for no benefit.
#
# WHY IT IS PUBLIC. Public repositories get unlimited free Actions minutes. The
# TrailTether repo's are exhausted, which is exactly why the thunder feed moved
# here in the first place. Follow the precedent, do not move this into a private
# repo without checking the minutes budget first.
#
# ⚠️ met.no ATTRIBUTION IS NOT OPTIONAL. Their data is CC BY 4.0 and the licence
# obliges visible credit. The feed carries `attribution_text` so a consumer is
# handed it rather than having to know; whatever renders this must display it.

on:
  schedule:
    # Hourly at :15. met.no's Expires header sits ~30 minutes out, so hourly is
    # well inside what they refresh and nowhere near their 20 req/s cap (this is
    # 22 requests spread over ~22 seconds, once an hour).
    #
    # Offset from the thunder job (:30 on 4,10,16,22) on purpose, so the two
    # never contend for a runner or interleave their logs.
    - cron: '15 * * * *'
  workflow_dispatch:

# A run publishing a half-built feed while another is mid-flight would be worse
# than a missed hour.
concurrency:
  group: wx-stations
  cancel-in-progress: false

jobs:
  build:
    name: Build & publish weather station feed
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # Deliberately no pip install: the script uses only the standard library.
      # Unlike the thunder job it decodes no GRIB, so it needs no ecCodes and no
      # numpy — keep it that way, it is why this job takes seconds.

      - name: Validate the station list
        run: python scripts/fetch_wx_stations.py --stations stations/berg.json --dry-run

      - name: Build feed
        run: python scripts/fetch_wx_stations.py --stations stations/berg.json --out out/wx-stations.json.gz

      # The script exits non-zero and writes NOTHING when fewer than 80% of
      # stations return a forecast, so reaching this step means the artifact is
      # whole. Publishing is a separate step for that reason: a partial build
      # must never overwrite a good file, because a station missing its forecast
      # renders as an absence of weather rather than an absence of data.
      - name: Publish to R2
        env:
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          RCLONE_CONFIG_R2_ACL: private
        run: |
          curl -fsSL https://rclone.org/install.sh | sudo bash
          # --s3-no-check-bucket is REQUIRED: without it rclone attempts
          # CreateBucket and R2 answers 403 AccessDenied. Same flag the thunder
          # publish and the tile publish both use.
          #
          # max-age=1800 matches met.no's own Expires window — there is no point
          # a client holding this longer than the upstream data is valid, and no
          # point refetching sooner.
          rclone copyto out/wx-stations.json.gz r2:tt-tiles/weather/wx-stations.json.gz \
            --s3-no-check-bucket --header-upload "Cache-Control: public, max-age=1800"

      # Diagnostic only, and AFTER the publish. continue-on-error for the reason
      # documented at length in dwd-thunder.yml: from 2026-08-07 this exact step
      # failed every run on an artifact storage quota while the forecast itself
      # published perfectly, and it was allowed to fail the whole job. Nothing a
      # user sees depends on this.
      - name: Upload artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: wx-stations
          path: out/wx-stations.json.gz
          retention-days: 7
